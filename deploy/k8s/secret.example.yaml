# feishu-cli MCP Server — Kubernetes 部署清单
#
# ⚠️ 本文件是 Secret 的**示例模板**，值均为占位符。
#    不要在这里填真实凭证后提交。推荐做法见 docs/DEPLOY.md：
#      kubectl create secret generic feishu-cli-mcp-secret \
#        --from-literal=FEISHU_APP_ID=cli_xxx \
#        --from-literal=FEISHU_APP_SECRET=xxx \
#        --from-literal=MCP_AUTH_TOKEN=xxx
#    或用 External Secrets / Vault 等外部密钥管理。
#
# 应用顺序：
#   kubectl apply -f deploy/k8s/secret.example.yaml   # 仅在用模板方式时
#   kubectl apply -f deploy/k8s/deployment.yaml
#   kubectl apply -f deploy/k8s/service.yaml
#
# 或一次性：kubectl apply -f deploy/k8s/
#
# 详见 docs/DEPLOY.md。
---
apiVersion: v1
kind: Secret
metadata:
  name: feishu-cli-mcp-secret
  labels:
    app.kubernetes.io/name: feishu-cli-mcp
type: Opaque
stringData:
  # 飞书应用凭证。从开放平台获取：https://open.feishu.cn/app
  FEISHU_APP_ID: "cli_xxxxxxxxxxxx"
  FEISHU_APP_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # MCP 客户端的静态 Bearer token（对应 `mcp stream --auth-token`）。
  # 任意足够随机的字符串；客户端调用时需带 Authorization: Bearer <该值>。
  # 留空或不设置 => 服务不启用任何认证（完全开放），切勿这样上生产。
  MCP_AUTH_TOKEN: "change-me-to-a-long-random-token"
