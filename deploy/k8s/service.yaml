# feishu-cli MCP Server — Service
#
# 在集群内暴露 SSE 端点。MCP 客户端（或调用它的应用）通过该 Service 访问：
#   http://feishu-cli-mcp.<namespace>.svc.cluster.local:8080/sse
#
# 如需集群外访问，二选一：
#   - 把 type 改为 LoadBalancer / NodePort；
#   - 或保留 ClusterIP，另建 Ingress（SSE 需要支持长连接与缓冲关闭，
#     见 docs/DEPLOY.md 的「集群外暴露」章节）。
apiVersion: v1
kind: Service
metadata:
  name: feishu-cli-mcp
  labels:
    app.kubernetes.io/name: feishu-cli-mcp
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: feishu-cli-mcp
  ports:
    - name: sse
      port: 8080
      targetPort: sse
      protocol: TCP
